<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 1024px;
    height: 1024px;
    background: transparent;
    overflow: hidden;
  }
  svg { display: block; }
</style>
</head>
<body>
<svg width="1024" height="1024" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E2E6E7"/>
      <stop offset="0.55" stop-color="#9FA5A7"/>
      <stop offset="1" stop-color="#4F5557"/>
    </linearGradient>
    <linearGradient id="copper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E0A878"/>
      <stop offset="1" stop-color="#7A4A2A"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5DEAD8"/>
      <stop offset="1" stop-color="#0E8A7C"/>
    </linearGradient>
  </defs>
  <!-- Silver outer G ring -->
  <path d="M16 4a12 12 0 1 0 12 12h-3a9 9 0 1 1-9-9z" fill="url(#silver)"/>
  <!-- Copper inner G curve -->
  <path d="M28 16a12 12 0 0 1-12 12v-3a9 9 0 0 0 9-9z" fill="url(#copper)"/>
  <!-- Teal play triangle -->
  <path d="m13 11 8 5-8 5z" fill="url(#teal)"/>
</svg>
</body>
</html>
