<!DOCTYPE html>
<html lang="tr"><head>
<meta charset="utf-8"><title>Genç IPTV — Splash (animasyonlu)</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E1213">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --ink:#0E1213; --ink2:#161B1D; --ink3:#1F2A2C;
  --paper:#F6F2EC; --paperWhite:#FFFFFF;
  --text:#E8EDEC; --textDim:#9DA8A6; --textFaint:#6A7472;
  --inkText:#14120E; --inkDim:#5A564D; --inkFaint:#8A857A;
  --teal:#3FD0BD; --tealDk:#0F8A7E;
  --copper:#C68A5C; --copperDk:#A8693C;
}
html,body{height:100%;height:100dvh}
body{margin:0;font-family:'Geist',system-ui,sans-serif;background:#000;color:var(--text);-webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-tap-highlight-color:transparent}

/* Stage = full-bleed splash surface */
.stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;overflow:hidden;transition:background 360ms cubic-bezier(.2,0,0,1)}

/* Variant backgrounds */
.stage.dark{background:radial-gradient(120% 120% at 50% 35%,#1F2A2C,#0A0D0E 70%)}
.stage.light{background:radial-gradient(120% 120% at 50% 30%,#FFFFFF,#F6F2EC 70%);color:var(--inkText)}
.stage.teal{background:linear-gradient(135deg,#0F8A7E,#3FD0BD);color:#fff}
.stage.copper{background:linear-gradient(135deg,#7A4A2A,#C68A5C);color:#fff}

/* Vignette / glow overlays per variant */
.stage.dark::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 38%,rgba(63,208,189,0.14),transparent 58%);pointer-events:none}
.stage.teal::before,.stage.copper::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 38%,rgba(255,255,255,0.18),transparent 60%);pointer-events:none}

/* ───── Mark + animation sequence ───── */
.mark{
  position:relative;width:36vmin;height:36vmin;max-width:200px;max-height:200px;
  opacity:0;transform:translateY(8px) scale(0.86);
  animation: mark-in 720ms cubic-bezier(.2,0,0,1) 200ms forwards,
             mark-pulse 1800ms cubic-bezier(.4,0,.4,1) 900ms infinite;
  filter: drop-shadow(0 12px 40px rgba(0,0,0,0.4));
}
.stage.light .mark{filter: drop-shadow(0 4px 16px rgba(20,18,14,0.12))}

@keyframes mark-in{
  0%   { opacity:0; transform: translateY(8px) scale(0.86); }
  60%  { opacity:1; transform: translateY(0) scale(1.04); }
  100% { opacity:1; transform: translateY(0) scale(1); }
}
@keyframes mark-pulse{
  0%, 100% { transform: scale(1); }
  50%      { transform: scale(0.94); }
}

/* Halo ring that emanates outward right after mark settles */
.halo{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.halo::before, .halo::after{
  content:"";position:absolute;width:36vmin;height:36vmin;max-width:200px;max-height:200px;border-radius:50%;
  border:1px solid rgba(63,208,189,0.55);
  opacity:0;transform:scale(0.85);
  animation: halo 2400ms cubic-bezier(.2,0,0,1) infinite;
}
.halo::after{animation-delay:1200ms}
.stage.light .halo::before, .stage.light .halo::after{border-color:rgba(15,138,126,0.45)}
.stage.teal .halo::before, .stage.teal .halo::after, .stage.copper .halo::before, .stage.copper .halo::after{border-color:rgba(255,255,255,0.5)}
@keyframes halo{
  0%   { opacity:0;   transform: scale(0.85); }
  20%  { opacity:0.7; transform: scale(1.0); }
  100% { opacity:0;   transform: scale(2.4); }
}

/* Wordmark + tagline reveal */
.word{
  margin-top:32px;font-family:'Instrument Serif',serif;font-style:italic;font-size:clamp(34px,9vmin,52px);
  letter-spacing:-0.025em;line-height:1;text-align:center;
  opacity:0;transform:translateY(6px);
  animation: rise 600ms cubic-bezier(.2,0,0,1) 760ms forwards;
}
.tag{
  margin-top:10px;font-family:'Geist Mono',monospace;font-size:11px;letter-spacing:0.24em;text-transform:uppercase;text-align:center;
  color:var(--textFaint);
  opacity:0;transform:translateY(4px);
  animation: rise 540ms cubic-bezier(.2,0,0,1) 920ms forwards;
}
.stage.light .tag{color:var(--inkFaint)}
.stage.teal .tag, .stage.copper .tag{color:rgba(255,255,255,0.78)}

@keyframes rise{
  0% { opacity:0; transform: translateY(6px); }
  100% { opacity:1; transform: translateY(0); }
}

/* Loading line at bottom — centered horizontally inside the stage */
.loading{
  position:absolute;bottom:9%;left:0;right:0;
  text-align:center;
  font-family:'Geist Mono',monospace;font-size:11px;letter-spacing:0.22em;text-transform:uppercase;
  color:var(--teal);
  opacity:0;
  animation: rise 540ms cubic-bezier(.2,0,0,1) 1100ms forwards, blink 1400ms ease-in-out 1100ms infinite;
}
.stage.light .loading{color:var(--tealDk)}
.stage.teal .loading, .stage.copper .loading{color:#fff}

@keyframes blink{
  0%, 100% { opacity:0.55 }
  50%      { opacity:1 }
}

/* Tiny progress bar under loading */
.bar{
  position:absolute;bottom:5.5%;left:50%;margin-left:-60px;
  width:120px;height:2px;border-radius:2px;background:rgba(255,255,255,0.08);overflow:hidden;
  opacity:0;animation: rise 480ms cubic-bezier(.2,0,0,1) 1280ms forwards;
}
.stage.light .bar{background:rgba(20,18,14,0.08)}
.stage.teal .bar, .stage.copper .bar{background:rgba(255,255,255,0.22)}
.bar::after{
  content:"";position:absolute;inset:0;width:40%;
  background:linear-gradient(90deg,transparent,var(--teal),transparent);
  animation: sweep 1600ms cubic-bezier(.4,0,.2,1) 1280ms infinite;
}
.stage.light .bar::after{background:linear-gradient(90deg,transparent,var(--tealDk),transparent)}
.stage.teal .bar::after, .stage.copper .bar::after{background:linear-gradient(90deg,transparent,#fff,transparent)}
@keyframes sweep{
  0%   { transform: translateX(-100%); }
  100% { transform: translateX(350%); }
}

/* Controls UI (hides for clean recording) */
.controls{
  position:fixed;top:max(16px, env(safe-area-inset-top));left:50%;transform:translateX(-50%);
  display:flex;flex-wrap:wrap;justify-content:center;gap:4px;padding:5px;border-radius:999px;background:rgba(0,0,0,0.55);backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,0.08);
  font-family:'Geist Mono',monospace;font-size:9px;letter-spacing:0.08em;text-transform:uppercase;
  z-index:50;transition:opacity 220ms;
  max-width:calc(100vw - 24px);
}
.controls button{
  background:transparent;border:0;color:rgba(255,255,255,0.7);padding:7px 11px;border-radius:999px;cursor:pointer;
  font:inherit;letter-spacing:inherit;text-transform:inherit;
}
.controls button:hover{color:#fff;background:rgba(255,255,255,0.06)}
.controls button.on{color:#0E1213;background:#3FD0BD}
.controls .sep{width:1px;background:rgba(255,255,255,0.1);margin:4px 2px}
.controls .help{color:rgba(255,255,255,0.4);padding:8px 12px}
body.clean .controls{opacity:0;pointer-events:none}

/* Replay key hint */
.hint{
  position:fixed;bottom:18px;right:18px;
  font-family:'Geist Mono',monospace;font-size:9px;letter-spacing:0.14em;text-transform:uppercase;
  color:rgba(255,255,255,0.35);z-index:50;line-height:1.7;
}
body.clean .hint{opacity:0}
.stage.light ~ .hint{color:rgba(20,18,14,0.4)}

/* Frame mode — phone bezel */
body.framed .stage{
  width:min(380px, 80vw);height:min(820px, 86vh);
  inset:auto;position:relative;border-radius:48px;
  border:8px solid #0A0D0E;box-shadow:0 30px 80px rgba(0,0,0,0.6),0 0 0 1px rgba(255,255,255,0.04) inset;
}
body.framed{display:flex;align-items:center;justify-content:center;background:#0A0D0E}

/* Once-mode: stop infinite animations after first cycle */
body.once .mark{animation: mark-in 720ms cubic-bezier(.2,0,0,1) 200ms forwards}
body.once .halo::before, body.once .halo::after{animation-iteration-count:1}
body.once .loading{animation: rise 540ms cubic-bezier(.2,0,0,1) 1100ms forwards}
body.once .bar::after{animation-iteration-count:1}
</style></head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E2E6E7"/>
      <stop offset="0.55" stop-color="#9FA5A7"/>
      <stop offset="1" stop-color="#4F5557"/>
    </linearGradient>
    <linearGradient id="silverLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5A5F61"/>
      <stop offset="0.5" stop-color="#3F4446"/>
      <stop offset="1" stop-color="#22272A"/>
    </linearGradient>
    <linearGradient id="copperG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E0A878"/>
      <stop offset="1" stop-color="#7A4A2A"/>
    </linearGradient>
    <linearGradient id="copperGLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C68A5C"/>
      <stop offset="1" stop-color="#7A4A2A"/>
    </linearGradient>
    <linearGradient id="tealG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5DEAD8"/>
      <stop offset="1" stop-color="#0E8A7C"/>
    </linearGradient>
    <linearGradient id="tealGLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3FD0BD"/>
      <stop offset="1" stop-color="#0F8A7E"/>
    </linearGradient>
  </defs>
</svg>

<div class="controls" id="ctl">
  <button data-v="dark"  class="on">Koyu</button>
  <button data-v="light">Açık</button>
  <button data-v="teal">Turkuaz</button>
  <button data-v="copper">Bakır</button>
  <div class="sep"></div>
  <button data-act="replay">↻ Tekrar</button>
  <button data-act="loop"  class="on">Döngü</button>
  <button data-act="frame">Telefon</button>
  <button data-act="clean">Kayıt modu</button>
</div>

<div class="stage dark" id="stage">
  <div class="halo"></div>
  <div class="mark" id="mark">
    <svg viewBox="0 0 32 32" width="100%" height="100%">
      <path d="M16 4a12 12 0 1 0 12 12h-3a9 9 0 1 1-9-9z" fill="url(#silver)" id="p1"/>
      <path d="M28 16a12 12 0 0 1-12 12v-3a9 9 0 0 0 9-9z" fill="url(#copperG)" id="p2"/>
      <path d="m13 11 8 5-8 5z" fill="url(#tealG)" id="p3"/>
    </svg>
  </div>
  <div class="word" id="word">Genç</div>
  <div class="tag" id="tag">IPTV Player</div>
  <div class="loading" id="loading">Yükleniyor…</div>
  <div class="bar" id="bar"></div>
</div>

<div class="hint">
  1–4 · varyant<br>
  R · tekrar &nbsp; L · döngü<br>
  F · telefon &nbsp; C · kayıt modu
</div>

<script>
const stage = document.getElementById('stage');
const ctl = document.getElementById('ctl');
const variants = ['dark','light','teal','copper'];

function setVariant(v){
  variants.forEach(x => stage.classList.remove(x));
  stage.classList.add(v);
  ctl.querySelectorAll('[data-v]').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  // Swap gradient fills for light variant for legibility
  const light = (v === 'light');
  document.getElementById('p1').setAttribute('fill', light ? 'url(#silverLight)' : 'url(#silver)');
  document.getElementById('p2').setAttribute('fill', light ? 'url(#copperGLight)' : 'url(#copperG)');
  document.getElementById('p3').setAttribute('fill', light ? 'url(#tealGLight)' : 'url(#tealG)');
  // For teal/copper fills: paint mark white
  if (v === 'teal' || v === 'copper'){
    document.getElementById('p1').setAttribute('fill', '#fff');
    document.getElementById('p2').setAttribute('fill', 'rgba(255,255,255,0.85)');
    document.getElementById('p3').setAttribute('fill', '#0E1213');
  }
  replay();
}

function replay(){
  // Restart animations by cloning the stage subtree
  const nodes = ['mark','word','tag','loading','bar'];
  nodes.forEach(id => {
    const el = document.getElementById(id);
    el.style.animation = 'none';
    el.offsetHeight; // reflow
    el.style.animation = '';
  });
  // Halo pseudo-elements: toggle a class
  const halo = stage.querySelector('.halo');
  halo.style.display = 'none'; void halo.offsetHeight; halo.style.display = '';
}

function toggleLoop(){
  document.body.classList.toggle('once');
  ctl.querySelector('[data-act="loop"]').classList.toggle('on', !document.body.classList.contains('once'));
}
function toggleFrame(){
  document.body.classList.toggle('framed');
  ctl.querySelector('[data-act="frame"]').classList.toggle('on', document.body.classList.contains('framed'));
}
function toggleClean(){
  document.body.classList.toggle('clean');
}

ctl.addEventListener('click', e => {
  const v = e.target.dataset.v, a = e.target.dataset.act;
  if (v) setVariant(v);
  if (a === 'replay') replay();
  if (a === 'loop')   toggleLoop();
  if (a === 'frame')  toggleFrame();
  if (a === 'clean')  toggleClean();
});

window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (['1','2','3','4'].includes(k)) setVariant(variants[parseInt(k)-1]);
  if (k === 'r') replay();
  if (k === 'l') toggleLoop();
  if (k === 'f') toggleFrame();
  if (k === 'c') toggleClean();
  if (k === 'escape') document.body.classList.remove('clean');
});
</script>
</body></html>
