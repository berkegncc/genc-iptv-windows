[package]
name = "genc-iptv"
version = "0.1.0"
description = "Genç IPTV — Windows masaüstü oynatıcı"
authors = ["Berke Genç"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "genc_iptv_lib"
# Windows desktop only. The default Tauri mobile template emits staticlib/cdylib
# too, but those debug artifacts are huge on Windows. rlib is enough for the
# desktop binary and keeps local target caches much smaller.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-os = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
anyhow = "1"
thiserror = "1"

# Phase 1 — data layer + parsers + HTTP
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "gzip", "rustls-tls", "stream"] }
quick-xml = "0.36"
flate2 = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
once_cell = "1"
base64 = "0.22"
urlencoding = "2"
url = "2"
async-trait = "0.1"
futures = "0.3"

# Phase 1.7 — libmpv FFI for in-window video playback (Windows-only)
[target.'cfg(target_os = "windows")'.dependencies]
libmpv2 = "4"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_Power",
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.dev]
# Keep dev builds usable without letting Rust debug symbols balloon into tens
# of gigabytes. This trades a little debugger richness for a much smaller disk
# footprint.
debug = "line-tables-only"
incremental = false

[profile.dev.package."*"]
debug = false
